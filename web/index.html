<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta
      name="description"
      content="A personal workspace for learning, practicing, and revising Data Structures and Algorithms."
    />
    <title>Algospace — Your DSA workspace</title>
    <script>
      try {
        var d = JSON.parse(localStorage.getItem("dsa-workspace-v1"));
        document.documentElement.dataset.theme =
          d?.theme ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
